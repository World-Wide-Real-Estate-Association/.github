name: Validate workflow structure

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - update-game

permissions:
  contents: read

jobs:
  validate-workflows:
    name: Validate workflows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = sorted(Path(".github/workflows").glob("*.yml"))
          if not paths:
              raise SystemExit("No workflow files found in .github/workflows")

          for path in paths:
              with path.open(encoding="utf-8") as f:
                  yaml.safe_load(f)
              print(f"YAML OK: {path}")
          PY

      - name: Validate step workflow alignment
        run: |
          python - <<'PY'
          from pathlib import Path

          expected = [
              ("0-welcome.yml", "0", "1", "contents: read", "contents: write", [
                  "pull-requests: write",
                  "set -euo pipefail",
                  "git ls-remote --exit-code --heads origin",
                  "git switch --create",
                  "sed -i 's/Game over/Game over, refresh to play again 🧑‍💻 🤖!/' index.html",
              ]),
              ("1-open-a-pull-request.yml", "1", "2", "contents: read", "contents: write", [
                  "github.event_name == 'workflow_dispatch'",
                  "github.event.pull_request.base.ref == 'main'",
                  "github.event.pull_request.head.repo.full_name == github.repository",
                  "github.head_ref == 'update-game'",
              ]),
              ("2-assign-yourself.yml", "2", "3", "contents: read", "contents: write", [
                  "types:",
                  "- assigned",
                  "github.event_name == 'workflow_dispatch'",
                  "github.event.pull_request.base.ref == 'main'",
                  "github.event.pull_request.head.repo.full_name == github.repository",
                  "github.event.assignee.login == github.event.pull_request.user.login",
              ]),
              ("3-leave-a-review.yml", "3", "4", "contents: read", "contents: write", [
                  "github.event_name == 'workflow_dispatch'",
                  "github.event.pull_request.base.ref == 'main'",
                  "github.event.pull_request.head.repo.full_name == github.repository",
                  "github.event.review.user.login == github.event.pull_request.user.login",
              ]),
              ("4-suggest-changes.yml", "4", "5", "contents: read", "contents: write", [
                  "github.event_name == 'workflow_dispatch'",
                  "github.event.pull_request.base.ref == 'main'",
                  "github.event.pull_request.head.repo.full_name == github.repository",
                  "github.event.comment.user.login == github.event.pull_request.user.login",
              ]),
              ("5-apply-changes.yml", "5", "6", "contents: read", "contents: write", []),
              ("6-merge-your-pull-request.yml", "6", "X", "contents: read", "contents: write", []),
          ]

          base = Path(".github/workflows")
          for filename, from_step, to_step, read_permission, write_permission, required_snippets in expected:
              path = base / filename
              text = path.read_text(encoding="utf-8")

              if "skills/action-update-step@v2" not in text:
                  raise SystemExit(f"{filename}: missing skills/action-update-step@v2")
              if f"from_step: {from_step}" not in text:
                  raise SystemExit(f"{filename}: expected from_step: {from_step}")
              if f"to_step: {to_step}" not in text:
                  raise SystemExit(f"{filename}: expected to_step: {to_step}")

              expected_current = f"needs.get_current_step.outputs.current_step == {from_step}"
              if expected_current not in text:
                  raise SystemExit(
                      f"{filename}: expected condition containing '{expected_current}'"
                  )

              if "echo \"current_step=$(cat ./.github/steps/-step.txt)\" >> $GITHUB_OUTPUT" not in text:
                  raise SystemExit(f"{filename}: missing current step output extraction")

              if f"permissions:\n      {read_permission}" not in text:
                  raise SystemExit(f"{filename}: expected get_current_step permissions to be {read_permission}")
              if write_permission not in text:
                  raise SystemExit(f"{filename}: expected write permission '{write_permission}'")
              if "persist-credentials: false" not in text:
                  raise SystemExit(f"{filename}: expected checkout with persist-credentials: false")

              for snippet in required_snippets:
                  if snippet not in text:
                      raise SystemExit(f"{filename}: missing required snippet '{snippet}'")

              if filename == "2-assign-yourself.yml" and "- review_requested" in text:
                  raise SystemExit(f"{filename}: unexpected review_requested trigger")

              print(f"STRUCTURE OK: {filename}")
          PY
